name: Debug Network

on:
  workflow_dispatch:

jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - name: SteamCMD on bridge network
        run: |
          docker run --rm --user 0:0 -e HOME=/home/steam cm2network/steamcmd:root sh -c '
            /home/steam/steamcmd/steamcmd.sh +quit
            echo "STEAMCMD_EXIT=$?"
            echo "=== stderr.txt ==="
            tail -60 /home/steam/Steam/logs/stderr.txt 2>&1
            echo "=== logs dir ==="
            ls -la /home/steam/Steam/logs/ 2>&1
          ' || true

      - name: SteamCMD on host network
        run: |
          docker run --rm --network host --user 0:0 -e HOME=/home/steam cm2network/steamcmd:root sh -c '
            /home/steam/steamcmd/steamcmd.sh +quit
            echo "STEAMCMD_EXIT=$?"
            echo "=== stderr.txt ==="
            tail -30 /home/steam/Steam/logs/stderr.txt 2>&1
          ' || true

      - name: Probe steam endpoints
        run: |
          docker run --rm --user 0:0 cm2network/steamcmd:root sh -c '
            for h in steamcdn-a.akamaihd.net media.steampowered.com client-update.akamai.steamstatic.com api.steampowered.com cdn.steamstatic.com; do
              printf "%-45s " "$h"
              timeout 10 curl -sS -o /dev/null -w "%{http_code}\n" "https://$h/" 2>&1 || echo FAIL
            done
          ' || true
