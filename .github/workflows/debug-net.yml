name: Debug Network

on:
  workflow_dispatch

jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - name: cap-add dac-read-search only
        run: |
          docker run --rm --cap-add DAC_READ_SEARCH --user 0:0 -e HOME=/home/steam cm2network/steamcmd:root sh -c '/home/steam/steamcmd/steamcmd.sh +quit; echo CAP_DAC_EXIT=$?' || true

      - name: mask dmi paths
        run: |
          docker run --rm --security-opt systempaths=unconfined --user 0:0 -e HOME=/home/steam cm2network/steamcmd:root sh -c '/home/steam/steamcmd/steamcmd.sh +quit; echo SYSPATHS_EXIT=$?' || true

      - name: caps sys-ptrace sys-admin
        run: |
          docker run --rm --cap-add SYS_PTRACE --cap-add SYS_ADMIN --user 0:0 -e HOME=/home/steam cm2network/steamcmd:root sh -c '/home/steam/steamcmd/steamcmd.sh +quit; echo CAPS2_EXIT=$?' || true
